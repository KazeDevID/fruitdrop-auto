name: Build & Release FruitDrop APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build FruitDrop APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore debug keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -la debug.keystore

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Prepare & Verify APK
        run: |
          mkdir -p release-output
          VERSION_TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.7' }}"
          APK_NAME="FruitDrop-Auto-${VERSION_TAG}.apk"
          RAW_APK="app/build/outputs/apk/debug/app-debug.apk"
          cp "$RAW_APK" "release-output/${APK_NAME}"
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "Using build-tools: $BUILD_TOOLS_DIR"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "release-output/${APK_NAME}"
          "$BUILD_TOOLS_DIR/zipalign" -P 16 -c -v 4 "release-output/${APK_NAME}" | tail -n 5
          "$BUILD_TOOLS_DIR/aapt2" dump badging "release-output/${APK_NAME}" | head -n 5
          echo "APK_PATH=release-output/${APK_NAME}" >> "$GITHUB_ENV"
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"
          ls -la release-output/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FruitDrop-Yeetalk-AutoDrop-APK
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: "FruitDrop Auto (${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.7' }})"
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.7' }}
          draft: false
          prerelease: false
          body: |
            ## 🍓 FruitDrop - Yeetalk Fruit Merge Auto Bot

            Aplikasi otomatis menjatuhkan buah untuk game Fruit Merge di Yeetalk:
            - **Kiwi Hijau** & **Buah Persik (Peach)** otomatis drop ke **Paling Kiri**.
            - **Buah kecil lain** (Blueberry, Anggur, Stroberi, Jeruk) otomatis drop ke **Paling Kanan**.
            - **Real-time Fruit Detection** dengan kecepatan tinggi & akurasi kalibrasi.
            - **Floating Window & Minimized Bubble** yang praktis di atas game.
            - **Penanda Titik & Scanner Visual** yang dapat digeser di layar.

            ### 📥 Cara Pasang (Install)
            1. Unduh file **`${{ env.APK_NAME }}`** dari daftar **Assets** di bawah ini (bukan file Source Code `.zip`).
            2. Jika sebelumnya terpasang versi lama dengan tanda tangan berbeda dan muncul gagal pasang, **hapus (uninstall)** versi lama terlebih dahulu lalu pasang file APK ini.
          files: |
            ${{ env.APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
